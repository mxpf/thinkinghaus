name: Publish thinking.haus

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thinkinghaus-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Refresh public Webmentions
        run: npm run refresh:webmentions
        continue-on-error: true

      - name: Build published writing
        shell: bash
        run: |
          npm run build:pages
          node scripts/verify-static-export.mjs

      - name: Update the GitHub Pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add --detach /tmp/thinkinghaus-pages origin/gh-pages
          # Preserve old hashed CSS files: GitHub Pages may briefly serve an
          # older cached HTML document after deployment, and it must still be
          # able to load its stylesheet during that transition.
          # Compare file contents so a fresh checkout cannot retain stale HTML
          # when its size and timestamp happen to match the new export.
          rsync -a --checksum --delete --exclude .git --exclude _next/static/css/ \
            dist/client/ /tmp/thinkinghaus-pages/
          rsync -a dist/client/_next/static/css/ /tmp/thinkinghaus-pages/_next/static/css/
          touch /tmp/thinkinghaus-pages/.nojekyll
          node scripts/verify-static-export.mjs /tmp/thinkinghaus-pages
          cd /tmp/thinkinghaus-pages
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish site"
          git push origin HEAD:gh-pages
