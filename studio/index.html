<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thinkinghaus Studio</title>
    <link rel="stylesheet" href="/studio.css" />
  </head>
  <body>
    <div class="studio-shell">
      <header class="studio-header">
        <div class="studio-title">Thinkinghaus <span>Studio</span></div>
        <div class="save-state" id="save-state" aria-live="polite">Ready</div>
        <div class="header-actions">
          <a class="quiet-button" href="https://thinking.haus" target="_blank" rel="noreferrer">View live</a>
          <button class="publish-button" id="publish-button" type="button">Publish</button>
        </div>
      </header>

      <aside class="library" aria-label="Writing library">
        <button class="new-button" id="new-button" type="button">New piece <span>+</span></button>
        <nav id="post-navigation"></nav>
        <section class="history" aria-labelledby="history-title">
          <h2 id="history-title">Recent publishing</h2>
          <ol id="history-list"></ol>
        </section>
      </aside>

      <main class="editor" aria-label="Writing editor">
        <div class="editor-meta">
          <span class="post-state" id="post-state">Draft</span>
          <label class="date-field">
            <span class="sr-only">Date</span>
            <input id="date-input" type="date" />
          </label>
        </div>
        <label class="sr-only" for="title-input">Title</label>
        <textarea id="title-input" class="title-input" rows="2" placeholder="Untitled"></textarea>
        <label class="sr-only" for="body-input">Writing</label>
        <textarea id="body-input" class="body-input" placeholder="Begin anywhere."></textarea>

        <details class="source-details">
          <summary>Source or further reading</summary>
          <div class="source-fields">
            <label>
              <span>Link text</span>
              <input id="source-label-input" type="text" placeholder="Read the original piece" />
            </label>
            <label>
              <span>Web address</span>
              <input id="source-url-input" type="url" placeholder="https://" />
            </label>
          </div>
        </details>
      </main>

      <section class="preview" aria-label="Live article preview">
        <div class="preview-label">Preview</div>
        <article class="preview-article">
          <header>
            <h1 id="preview-title">Untitled</h1>
            <p id="preview-date"></p>
            <p id="preview-reading-time"></p>
          </header>
          <div id="preview-body"></div>
        </article>
      </section>
    </div>

    <div class="notice" id="notice" role="status" aria-live="polite"></div>
    <script type="module" src="/studio.js"></script>
  </body>
</html>
